name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Full pipeline (just check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install golangci-lint
        run: |
          VERSION=v2.13.2
          cd "${RUNNER_TEMP:-/tmp}"
          curl -sSfL --retry 3 -o "golangci-lint-${VERSION}-linux-amd64.tar.gz" \
            "https://github.com/golangci/golangci-lint/releases/download/${VERSION}/golangci-lint-${VERSION}-linux-amd64.tar.gz"
          curl -sSfL --retry 3 -o "golangci-lint-${VERSION}-checksums.txt" \
            "https://github.com/golangci/golangci-lint/releases/download/${VERSION}/golangci-lint-${VERSION}-checksums.txt"
          sha256sum -c --ignore-missing --quiet "golangci-lint-${VERSION}-checksums.txt"
          tar -xzf "golangci-lint-${VERSION}-linux-amd64.tar.gz" "golangci-lint-${VERSION}-linux-amd64/golangci-lint"
          mkdir -p "$HOME/.local/bin"
          mv "golangci-lint-${VERSION}-linux-amd64/golangci-lint" "$HOME/.local/bin/golangci-lint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run just check
        run: just check

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitcore
          POSTGRES_PASSWORD: fitcore
          POSTGRES_DB: fitcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitcore -d fitcore_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Migrate schema
        run: just migrate-up
        env:
          DATABASE_URL: postgres://fitcore:fitcore@localhost:5432/fitcore_test?sslmode=disable
      - name: Run integration tests
        run: just test-integration
        env:
          TEST_DATABASE_URL: postgres://fitcore:fitcore@localhost:5432/fitcore_test?sslmode=disable

  images:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -f deploy/Dockerfile.server -t fitcore:ci .
      - name: Build migrate image
        run: docker build -f deploy/Dockerfile.migrate -t fitcore-migrate:ci .