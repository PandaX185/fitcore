name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  checks:
    name: Full pipeline (just check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/casey/just/master/www/install.sh | bash -s -- --tag 1.58.0 --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install golangci-lint
        run: |
          GOBIN="$HOME/.local/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run just check
        run: just check
      - name: Vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitcore
          POSTGRES_PASSWORD: fitcore
          POSTGRES_DB: fitcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitcore -d fitcore_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/casey/just/master/www/install.sh | bash -s -- --tag 1.58.0 --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Migrate schema
        run: just migrate-up
        env:
          DATABASE_URL: postgres://fitcore:fitcore@localhost:5432/fitcore_test?sslmode=disable
      - name: Run integration tests
        run: just test-integration
        env:
          TEST_DATABASE_URL: postgres://fitcore:fitcore@localhost:5432/fitcore_test?sslmode=disable

  images:
    name: Build, scan and publish images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build server image
        run: docker build -f deploy/Dockerfile.server -t fitcore:ci .
      - name: Build migrate image
        run: docker build -f deploy/Dockerfile.migrate -t fitcore-migrate:ci .
      - name: Scan server image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fitcore:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish images to GHCR
        if: github.event_name == 'push'
        env:
          REGISTRY: ghcr.io
          IMAGE: ${{ github.repository }}
          METADATA_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
        run: |
          IMAGE=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag fitcore:ci "$REGISTRY/$IMAGE:$METADATA_TAG"
          docker tag fitcore:ci "$REGISTRY/$IMAGE:sha-${GITHUB_SHA::12}"
          docker tag fitcore-migrate:ci "$REGISTRY/$IMAGE-migrate:$METADATA_TAG"
          docker push "$REGISTRY/$IMAGE:$METADATA_TAG"
          docker push "$REGISTRY/$IMAGE:sha-${GITHUB_SHA::12}"
          docker push "$REGISTRY/$IMAGE-migrate:$METADATA_TAG"