groups:
  - name: fitcore.rules
    rules:
      - alert: FitCoreUp
        expr: up{job="fitcore"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "FitCore server is down"
          description: "Prometheus cannot reach the FitCore /metrics endpoint."

      - alert: RedisDown
        expr: absent(up{job="redis"}) or up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down or unmonitored"
          description: "The redis scrape target is down, or no redis job is configured in Prometheus."

      - alert: FitCoreHighErrorRate
        expr: |
          sum(rate(fitcore_http_requests_total{status=~"5.."}[5m]))
            / sum(rate(fitcore_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "FitCore 5xx rate above 5%"
          description: "HTTP 5xx responses exceeded 5% of all traffic over the last 5 minutes."

      - alert: FitCoreHigh4xxRate
        expr: |
          sum(rate(fitcore_http_requests_total{status=~"4.."}[5m]))
            / sum(rate(fitcore_http_requests_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "FitCore 4xx rate above 10%"
          description: "HTTP 4xx responses exceeded 10% of all traffic over the last 5 minutes."

      - alert: FitCoreSlowResponses
        expr: |
          histogram_quantile(0.95,
            sum(rate(fitcore_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "FitCore p95 latency above 2s"
          description: "The 95th percentile HTTP latency exceeded 2 seconds over the last 10 minutes."

      - alert: FitCoreDatabaseErrors
        expr: sum(rate(fitcore_database_errors_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "FitCore database errors"
          description: "Database errors are being observed by repositories at a rate above 0.1/s."

      - alert: FitCoreApplicationErrors
        expr: sum(rate(fitcore_application_errors_total[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "FitCore application errors"
          description: "Application-level errors are being returned to clients at a rate above 0.5/s."